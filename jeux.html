  <h2>Mes jeux vidéo 🎮</h2>

  <div class="grid" id="gameGrid"></div>
</section>

<footer>Fait avec ✦ par Varg · Site personnel en construction</footer>

<script src="common.js"></script>
<script>
const games=[ // [emoji, nom, note, heures, image]
 ["⚔️","Elden Ring","9/10","170 h","Elden%20ring.webp"],
 ["🗡️","Ghost of Tsushima","8/10","80 h","GOT.jpg"],
 ["🔫","CS2","8/10","200 h","CS2.jpg"]
];
games.forEach(g=>{
 const c=document.createElement('div');c.className='card game';
 c.innerHTML=`<div class="ico">${g[0]}<img src="${g[4]}" alt="" onerror="this.remove()"></div><div><h3>${g[1]}</h3><p>⭐ ${g[2]} · ⏱️ ${g[3]}</p></div>`;
 $('gameGrid').appendChild(c);
});
reveal();
</script>
