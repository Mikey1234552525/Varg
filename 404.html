<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable — Varg</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a1408'/%3E%3Ctext x='50' y='72' font-size='70' text-anchor='middle' fill='%23ffd23f'%3E✦%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#20170c;--text:#fffdf0;--muted:#d8c690;--a:#ffd23f;--a2:#ff9f1c}
@media (prefers-color-scheme:light){:root{--bg:#fff6dc;--text:#36281a;--muted:#8d6337;--a:#e0a100;--a2:#f57c00}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--a) 25%,var(--bg)),var(--bg) 60%) no-repeat,var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden}
main{position:relative;z-index:1}
h1{font-size:clamp(5rem,26vw,9rem);margin:0;line-height:1;background:linear-gradient(90deg,var(--a),var(--a2),#fff3b0,var(--a),var(--a2));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
p{color:var(--muted);margin:.5em 0 1.6em;font-size:1.1rem}
a{display:inline-block;background:linear-gradient(135deg,var(--a),var(--a2));color:#1a1408;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:26px}
.star{position:fixed;color:var(--a);opacity:.35;pointer-events:none;animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-22px) rotate(20deg);opacity:.8}}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Oups, cette page s’est perdue dans le vide ✦<br>Elle n’existe pas (ou plus).</p>
  <a href="/Varg/">← Retour à l’accueil</a>
</main>
<script>
for(let i=0;i<14;i++){const s=document.createElement('span');s.className='star';s.textContent='✦';
s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${10+Math.random()*16}px;animation-delay:${Math.random()*8}s`;document.body.appendChild(s)}
</script>
</body>
</html>
