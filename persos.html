<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Varg — Persos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <b>✦ Varg</b>
  <a href="index.html" >Accueil</a><a href="persos.html" aria-current="page">Persos</a><a href="jeux.html" >Jeux</a>
  <button id="themeBtn" title="Changer de thème">🌓</button>
</nav>

<section>
  <h2>Mes persos préférés 💛</h2>
  <p class="sub">Clique sur un perso pour en savoir plus.</p>
  <div class="top" id="topGrid"></div>
</section>

<footer>Fait avec ✦ par Varg · Site personnel en construction</footer>

<dialog id="favDlg">
  <h3 id="favTitle"></h3>
  <p id="favText"></p>
  <button onclick="this.closest('dialog').close()">Fermer</button>
</dialog>

<script src="common.js"></script>
<script>
/* [nom, image ou émoji, description] — ajoute une ligne par perso */
const favs=[
 ["Yoruichi","<img src='Yoruichi.jpg' style='width:100%;height:100%;object-fit:cover'>","Mon personnage préféré de Bleach : Yoruichi"]
];
favs.forEach((f,i)=>{
 const b=document.createElement('button');b.className='fav';
 b.innerHTML=`<div class="pic">${f[1]}</div><div class="info"><small>N° ${i+1}</small><h3>${f[0]}</h3></div>`;
 b.onclick=()=>{favTitle.textContent=`N° ${i+1} — ${f[0]}`;favText.textContent=f[2];favDlg.showModal()};
 $('topGrid').appendChild(b);
});
reveal();
</script>
</body>
</html>
